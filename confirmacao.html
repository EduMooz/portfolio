<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icone.png">
    <title>Mensagem enviada</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0d0d0f;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#16161a;
            padding:50px;
            border-radius:16px;
            text-align:center;
            max-width:500px;
            border:1px solid rgba(255,255,255,.08);
        }

        h1{
            color:#7c6af7;
            margin-bottom:20px;
        }

        p{
            color:#b3b3c2;
            margin-bottom:30px;
        }

        a{
            display:inline-block;
            background:#7c6af7;
            color:white;
            text-decoration:none;
            padding:12px 25px;
            border-radius:8px;
        }

        a:hover{
            background:#6a5af0;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>✅ Mensagem enviada!</h1>

    <p>
        Obrigado pelo contato.
        Responderei sua mensagem o mais breve possível.
    </p>

    <a href="index.html">
        Voltar ao portfólio
    </a>
</div>

</body>
</html>
